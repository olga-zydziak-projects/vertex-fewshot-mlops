        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef rejection_report_component(\n    accuracy_mean: float, accuracy_ci95:\
          \ float, accuracy_std: float,\n    accuracy_threshold: float, max_std_threshold:\
          \ float, gate_reason: str,\n    report: Output[HTML],\n) -> str:\n    def\
          \ svg_gauge(value, threshold, lo, hi, label, value_label, threshold_label,\n\
          \                  width=640, height=90, pass_side=\"right\"):\n       \
          \ pad = 60\n        bar_w = width - 2 * pad\n        y = 42\n\n        def\
          \ x_px(v):\n            v = max(lo, min(hi, v))\n            return pad\
          \ + (v - lo) / (hi - lo or 1) * bar_w\n\n        tx, vx = x_px(threshold),\
          \ x_px(value)\n        if pass_side == \"right\":\n            fail_rect\
          \ = f'<rect x=\"{pad}\" y=\"{y}\" width=\"{tx-pad:.1f}\" height=\"14\" fill=\"\
          #f6d5d1\"/>'\n            pass_rect = f'<rect x=\"{tx:.1f}\" y=\"{y}\" width=\"\
          {pad+bar_w-tx:.1f}\" height=\"14\" fill=\"#d9ead9\"/>'\n        else:\n\
          \            pass_rect = f'<rect x=\"{pad}\" y=\"{y}\" width=\"{tx-pad:.1f}\"\
          \ height=\"14\" fill=\"#d9ead9\"/>'\n            fail_rect = f'<rect x=\"\
          {tx:.1f}\" y=\"{y}\" width=\"{pad+bar_w-tx:.1f}\" height=\"14\" fill=\"\
          #f6d5d1\"/>'\n        ok = (value >= threshold) if pass_side == \"right\"\
          \ else (value <= threshold)\n        col = \"#2a7d4f\" if ok else \"#c0392b\"\
          \n        return (f'<svg viewBox=\"0 0 {width} {height}\" xmlns=\"http://www.w3.org/2000/svg\"\
          >'\n                f'<text x=\"{pad}\" y=\"20\" font-size=\"13\" fill=\"\
          #333\" font-weight=\"600\">{label}</text>'\n                f'{fail_rect}{pass_rect}'\n\
          \                f'<line x1=\"{tx:.1f}\" y1=\"{y-6}\" x2=\"{tx:.1f}\" y2=\"\
          {y+20}\" stroke=\"#c0392b\" stroke-width=\"2\"/>'\n                f'<text\
          \ x=\"{tx:.1f}\" y=\"{y+34}\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"\
          middle\">{threshold_label}</text>'\n                f'<circle cx=\"{vx:.1f}\"\
          \ cy=\"{y+7}\" r=\"7\" fill=\"{col}\"/>'\n                f'<text x=\"{vx:.1f}\"\
          \ y=\"{y-10}\" font-size=\"11\" fill=\"{col}\" text-anchor=\"middle\" font-weight=\"\
          600\">{value_label}</text>'\n                f'</svg>')\n\n    lower = accuracy_mean\
          \ - accuracy_ci95\n    g1 = svg_gauge(lower, accuracy_threshold, min(0.5,\
          \ lower - 0.05), 1.0,\n                   \"Criterion 1: lower 95% CI bound\
          \ (must be RIGHT of the threshold)\",\n                   f\"{lower:.3f}\"\
          , f\"threshold {accuracy_threshold}\", pass_side=\"right\")\n    g2 = svg_gauge(accuracy_std,\
          \ max_std_threshold, 0.0, max(0.15, accuracy_std * 1.5),\n             \
          \      \"Criterion 2: std / spread (must be LEFT of the max)\",\n      \
          \             f\"{accuracy_std:.3f}\", f\"max {max_std_threshold}\", pass_side=\"\
          left\")\n    html = f\"\"\"<!DOCTYPE html><html><head><style>\nbody{{font-family:-apple-system,sans-serif;margin:24px;color:#1a1a1a;max-width:760px}}\n\
          .verdict{{font-size:18px;font-weight:700;color:#c0392b;margin:10px 0}}\n\
          .metric{{display:inline-block;margin:8px 28px 8px 0}}.metric .v{{font-size:24px;font-weight:600;color:#4C72B0}}\n\
          .metric .l{{font-size:12px;color:#666}}.reason{{font-size:13px;color:#555;background:#f7f7f7;padding:10px;border-radius:6px}}\n\
          .meta{{font-size:12px;color:#888}}</style></head><body>\n<h2>Gate Rejection\
          \ Report</h2>\n<div class=\"verdict\">MODEL REJECTED - not registered, not\
          \ promoted</div>\n<div class=\"metric\"><div class=\"v\">{accuracy_mean:.2%}</div><div\
          \ class=\"l\">mean accuracy</div></div>\n<div class=\"metric\"><div class=\"\
          v\">{lower:.4f}</div><div class=\"l\">lower 95% CI</div></div>\n<div class=\"\
          metric\"><div class=\"v\">{accuracy_std:.4f}</div><div class=\"l\">std (spread)</div></div>\n\
          {g1}{g2}\n<p class=\"reason\">{gate_reason}</p>\n<p class=\"meta\">A dot\
          \ in the red zone is the reason for rejection. The mean alone can look fine\
          \ while\nthe lower-CI bound (confidence, penalized by spread) or the spread\
          \ itself fails - see the two gauges.</p>\n</body></html>\"\"\"\n    with\
          \ open(report.path, \"w\") as f:\n        f.write(html)\n    print(f\"Rejection\
          \ report written. Reason: {gate_reason}\")\n    return \"rejected-report-written\"\
          \n\n"
        image: python:3.10
