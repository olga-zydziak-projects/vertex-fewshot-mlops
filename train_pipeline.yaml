          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef verify_frozen_component(project: str, bucket: str, dataset: str)\
          \ -> str:\n    from google.cloud import storage\n    import json as _json\n\
          \    c = storage.Client(project=project)\n    m = _json.loads(c.bucket(bucket).blob(f\"\
          raw/{dataset}/MANIFEST.json\").download_as_bytes().decode(\"utf-8\"))\n\
          \    return f\"VERIFIED sha={m['archive_sha256'][:12]}\"\n\n"
        image: python:3.10
