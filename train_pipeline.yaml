          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_gate_component(\n    accuracy_mean: float, accuracy_ci95:\
          \ float, accuracy_std: float,\n    accuracy_threshold: float, max_std_threshold:\
          \ float,\n    gate_metrics: Output[Metrics],\n) -> NamedTuple(\"G\", [(\"\
          passed\", bool), (\"reason\", str)]):\n    checks = []\n    lower = accuracy_mean\
          \ - accuracy_ci95\n    checks.append((\"accuracy_lower_ci\", lower >= accuracy_threshold,\n\
          \                   f\"lowerCI={lower:.4f} vs threshold={accuracy_threshold:.4f}\"\
          ))\n    checks.append((\"stability\", accuracy_std <= max_std_threshold,\n\
          \                   f\"std={accuracy_std:.4f} vs max={max_std_threshold:.4f}\"\
          ))\n    passed = all(o for _, o, _ in checks)\n    reason = \"; \".join(f\"\
          {n}: {'PASS' if o else 'FAIL'} ({d})\" for n, o, d in checks)\n    gate_metrics.log_metric(\"\
          gate_passed\", 1.0 if passed else 0.0)\n    gate_metrics.log_metric(\"accuracy_lower_ci\"\
          , lower)\n    gate_metrics.log_metric(\"margin_above_threshold\", lower\
          \ - accuracy_threshold)\n    gate_metrics.log_metric(\"std_headroom\", max_std_threshold\
          \ - accuracy_std)\n    print(f\"Gate: {'PASSED' if passed else 'FAILED'}\
          \ - {reason}\")\n    from collections import namedtuple\n    return namedtuple(\"\
          G\", [\"passed\", \"reason\"])(passed, reason)\n\n"
