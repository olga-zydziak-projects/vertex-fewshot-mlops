# PIPELINE DEFINITION
# Name: fsl-hello-pipeline
# Description: verify -> train[CustomJob+container] -> gate -> If(register)
# Inputs:
#    accuracy_threshold: float [Default: 0.9]
#    bucket: str
#    dataset: str [Default: 'omniglot']
#    embedding_hid: int [Default: 64.0]
#    experiment_name: str [Default: 'fsl-inner-loop']
#    explain_episodes: int [Default: 60.0]
#    image_name: str [Default: 'train']
#    image_repo: str [Default: 'fsl-images']
#    k_shot: int [Default: 5.0]
#    max_std_threshold: float [Default: 0.05]
#    model_display_name: str [Default: 'fsl-protonet-omniglot']
#    n_way: int [Default: 5.0]
#    project: str
#    query: int [Default: 15.0]
#    region: str [Default: 'us-central1']
#    run_type: str [Default: 'inner_loop']
#    seed: int [Default: 0.0]
#    serving_container_image_uri: str [Default: 'us-central1-docker.pkg.dev/x/fsl-images/train:candidate']
#    test_episodes: int [Default: 1000.0]
#    train_iters: int [Default: 300.0]
components:
  comp-condition-2:
    dag:
      tasks:
        promote-image-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-promote-image-component
          inputs:
            parameters:
              image_name:
                componentInputParameter: pipelinechannel--image_name
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              repo:
                componentInputParameter: pipelinechannel--image_repo
              source_tag:
                runtimeValue:
                  constant: candidate
              target_tag:
                runtimeValue:
                  constant: production
          taskInfo:
            name: promote-image-component
        promote-model-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-promote-model-component
          inputs:
            parameters:
              model_resource_name:
                componentInputParameter: pipelinechannel--register-model-component-resource_name
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              version_id:
                componentInputParameter: pipelinechannel--register-model-component-version_id
          taskInfo:
            name: promote-model-component
    inputDefinitions:
      parameters:
        pipelinechannel--evaluate-gate-component-passed:
          parameterType: BOOLEAN
        pipelinechannel--heavy-eval-container-passed:
          parameterType: BOOLEAN
        pipelinechannel--image_name:
          parameterType: STRING
        pipelinechannel--image_repo:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--register-model-component-resource_name:
          parameterType: STRING
        pipelinechannel--register-model-component-version_id:
          parameterType: STRING
  comp-condition-3:
    dag:
      tasks:
        condition-2:
          componentRef:
            name: comp-condition-2
          dependentTasks:
          - heavy-eval-container
          - register-model-component
          inputs:
            parameters:
              pipelinechannel--evaluate-gate-component-passed:
                componentInputParameter: pipelinechannel--evaluate-gate-component-passed
              pipelinechannel--heavy-eval-container-passed:
                taskOutputParameter:
                  outputParameterKey: passed
                  producerTask: heavy-eval-container
              pipelinechannel--image_name:
                componentInputParameter: pipelinechannel--image_name
              pipelinechannel--image_repo:
                componentInputParameter: pipelinechannel--image_repo
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--register-model-component-resource_name:
                taskOutputParameter:
                  outputParameterKey: resource_name
                  producerTask: register-model-component
              pipelinechannel--register-model-component-version_id:
                taskOutputParameter:
                  outputParameterKey: version_id
                  producerTask: register-model-component
          taskInfo:
            name: heavy-passed
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--heavy-eval-container-passed']
              == true
        explain-container:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-explain-container
          dependentTasks:
          - heavy-eval-container
          - register-model-component
          inputs:
            parameters:
              bucket:
                componentInputParameter: pipelinechannel--bucket
              dataset:
                componentInputParameter: pipelinechannel--dataset
              model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
              model_version:
                taskOutputParameter:
                  outputParameterKey: version_id
                  producerTask: register-model-component
              n_episodes:
                componentInputParameter: pipelinechannel--explain_episodes
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
          taskInfo:
            name: explain-container
        heavy-eval-container:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-heavy-eval-container
          dependentTasks:
          - register-model-component
          inputs:
            parameters:
              accuracy_threshold:
                componentInputParameter: pipelinechannel--accuracy_threshold
              bucket:
                componentInputParameter: pipelinechannel--bucket
              dataset:
                componentInputParameter: pipelinechannel--dataset
              max_std_threshold:
                componentInputParameter: pipelinechannel--max_std_threshold
              model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
              model_version:
                taskOutputParameter:
                  outputParameterKey: version_id
                  producerTask: register-model-component
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              test_episodes:
                componentInputParameter: pipelinechannel--test_episodes
              train_accuracy_ci95:
                componentInputParameter: pipelinechannel--train-container-accuracy_ci95
              train_accuracy_mean:
                componentInputParameter: pipelinechannel--train-container-accuracy_mean
          taskInfo:
            name: heavy-eval-container
        register-model-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model-component
          inputs:
            parameters:
              accuracy_mean:
                componentInputParameter: pipelinechannel--train-container-accuracy_mean
              data_sha:
                componentInputParameter: pipelinechannel--train-container-data_sha
              model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
              model_display_name:
                componentInputParameter: pipelinechannel--model_display_name
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
              seed:
                componentInputParameter: pipelinechannel--seed
              serving_container_image_uri:
                componentInputParameter: pipelinechannel--serving_container_image_uri
          taskInfo:
            name: register-model-component
    inputDefinitions:
      parameters:
        pipelinechannel--accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--bucket:
          parameterType: STRING
        pipelinechannel--dataset:
          parameterType: STRING
        pipelinechannel--evaluate-gate-component-passed:
          parameterType: BOOLEAN
        pipelinechannel--explain_episodes:
          parameterType: NUMBER_INTEGER
        pipelinechannel--image_name:
          parameterType: STRING
        pipelinechannel--image_repo:
          parameterType: STRING
        pipelinechannel--max_std_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--model_display_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--seed:
          parameterType: NUMBER_INTEGER
        pipelinechannel--serving_container_image_uri:
          parameterType: STRING
        pipelinechannel--test_episodes:
          parameterType: NUMBER_INTEGER
        pipelinechannel--train-container-accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-accuracy_mean:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-data_sha:
          parameterType: STRING
        pipelinechannel--train-container-model_dir:
          parameterType: STRING
  comp-condition-4:
    dag:
      tasks:
        explain-container-2:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-explain-container-2
          inputs:
            parameters:
              bucket:
                componentInputParameter: pipelinechannel--bucket
              dataset:
                componentInputParameter: pipelinechannel--dataset
              model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
              model_version:
                runtimeValue:
                  constant: not-registered
              n_episodes:
                componentInputParameter: pipelinechannel--explain_episodes
              project:
                componentInputParameter: pipelinechannel--project
              region:
                componentInputParameter: pipelinechannel--region
          taskInfo:
            name: explain-container-2
        rejection-report-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-rejection-report-component
          inputs:
            parameters:
              accuracy_ci95:
                componentInputParameter: pipelinechannel--train-container-accuracy_ci95
              accuracy_mean:
                componentInputParameter: pipelinechannel--train-container-accuracy_mean
              accuracy_std:
                componentInputParameter: pipelinechannel--train-container-accuracy_std
              accuracy_threshold:
                componentInputParameter: pipelinechannel--accuracy_threshold
              gate_reason:
                componentInputParameter: pipelinechannel--evaluate-gate-component-reason
              max_std_threshold:
                componentInputParameter: pipelinechannel--max_std_threshold
          taskInfo:
            name: rejection-report-component
    inputDefinitions:
      parameters:
        pipelinechannel--accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--bucket:
          parameterType: STRING
        pipelinechannel--dataset:
          parameterType: STRING
        pipelinechannel--evaluate-gate-component-passed:
          parameterType: BOOLEAN
        pipelinechannel--evaluate-gate-component-reason:
          parameterType: STRING
        pipelinechannel--explain_episodes:
          parameterType: NUMBER_INTEGER
        pipelinechannel--max_std_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--train-container-accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-accuracy_mean:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-accuracy_std:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-model_dir:
          parameterType: STRING
  comp-condition-branches-1:
    dag:
      tasks:
        condition-3:
          componentRef:
            name: comp-condition-3
          inputs:
            parameters:
              pipelinechannel--accuracy_threshold:
                componentInputParameter: pipelinechannel--accuracy_threshold
              pipelinechannel--bucket:
                componentInputParameter: pipelinechannel--bucket
              pipelinechannel--dataset:
                componentInputParameter: pipelinechannel--dataset
              pipelinechannel--evaluate-gate-component-passed:
                componentInputParameter: pipelinechannel--evaluate-gate-component-passed
              pipelinechannel--explain_episodes:
                componentInputParameter: pipelinechannel--explain_episodes
              pipelinechannel--image_name:
                componentInputParameter: pipelinechannel--image_name
              pipelinechannel--image_repo:
                componentInputParameter: pipelinechannel--image_repo
              pipelinechannel--max_std_threshold:
                componentInputParameter: pipelinechannel--max_std_threshold
              pipelinechannel--model_display_name:
                componentInputParameter: pipelinechannel--model_display_name
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--seed:
                componentInputParameter: pipelinechannel--seed
              pipelinechannel--serving_container_image_uri:
                componentInputParameter: pipelinechannel--serving_container_image_uri
              pipelinechannel--test_episodes:
                componentInputParameter: pipelinechannel--test_episodes
              pipelinechannel--train-container-accuracy_ci95:
                componentInputParameter: pipelinechannel--train-container-accuracy_ci95
              pipelinechannel--train-container-accuracy_mean:
                componentInputParameter: pipelinechannel--train-container-accuracy_mean
              pipelinechannel--train-container-data_sha:
                componentInputParameter: pipelinechannel--train-container-data_sha
              pipelinechannel--train-container-model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
          taskInfo:
            name: gate-passed
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--evaluate-gate-component-passed']
              == true
        condition-4:
          componentRef:
            name: comp-condition-4
          inputs:
            parameters:
              pipelinechannel--accuracy_threshold:
                componentInputParameter: pipelinechannel--accuracy_threshold
              pipelinechannel--bucket:
                componentInputParameter: pipelinechannel--bucket
              pipelinechannel--dataset:
                componentInputParameter: pipelinechannel--dataset
              pipelinechannel--evaluate-gate-component-passed:
                componentInputParameter: pipelinechannel--evaluate-gate-component-passed
              pipelinechannel--evaluate-gate-component-reason:
                componentInputParameter: pipelinechannel--evaluate-gate-component-reason
              pipelinechannel--explain_episodes:
                componentInputParameter: pipelinechannel--explain_episodes
              pipelinechannel--max_std_threshold:
                componentInputParameter: pipelinechannel--max_std_threshold
              pipelinechannel--project:
                componentInputParameter: pipelinechannel--project
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--train-container-accuracy_ci95:
                componentInputParameter: pipelinechannel--train-container-accuracy_ci95
              pipelinechannel--train-container-accuracy_mean:
                componentInputParameter: pipelinechannel--train-container-accuracy_mean
              pipelinechannel--train-container-accuracy_std:
                componentInputParameter: pipelinechannel--train-container-accuracy_std
              pipelinechannel--train-container-model_dir:
                componentInputParameter: pipelinechannel--train-container-model_dir
          taskInfo:
            name: gate-failed
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--evaluate-gate-component-passed'']
              == true)'
    inputDefinitions:
      parameters:
        pipelinechannel--accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--bucket:
          parameterType: STRING
        pipelinechannel--dataset:
          parameterType: STRING
        pipelinechannel--evaluate-gate-component-passed:
          parameterType: BOOLEAN
        pipelinechannel--evaluate-gate-component-reason:
          parameterType: STRING
        pipelinechannel--explain_episodes:
          parameterType: NUMBER_INTEGER
        pipelinechannel--image_name:
          parameterType: STRING
        pipelinechannel--image_repo:
          parameterType: STRING
        pipelinechannel--max_std_threshold:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--model_display_name:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--seed:
          parameterType: NUMBER_INTEGER
        pipelinechannel--serving_container_image_uri:
          parameterType: STRING
        pipelinechannel--test_episodes:
          parameterType: NUMBER_INTEGER
        pipelinechannel--train-container-accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-accuracy_mean:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-accuracy_std:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--train-container-data_sha:
          parameterType: STRING
        pipelinechannel--train-container-model_dir:
          parameterType: STRING
  comp-evaluate-gate-component:
    executorLabel: exec-evaluate-gate-component
    inputDefinitions:
      parameters:
        accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        accuracy_mean:
          parameterType: NUMBER_DOUBLE
        accuracy_std:
          parameterType: NUMBER_DOUBLE
        accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        max_std_threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        gate_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        passed:
          parameterType: BOOLEAN
        reason:
          parameterType: STRING
  comp-explain-container:
    executorLabel: exec-explain-container
    inputDefinitions:
      parameters:
        bucket:
          parameterType: STRING
        dataset:
          parameterType: STRING
        model_dir:
          parameterType: STRING
        model_version:
          parameterType: STRING
        n_episodes:
          parameterType: NUMBER_INTEGER
        project:
          parameterType: STRING
        region:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        summary:
          parameterType: STRING
  comp-explain-container-2:
    executorLabel: exec-explain-container-2
    inputDefinitions:
      parameters:
        bucket:
          parameterType: STRING
        dataset:
          parameterType: STRING
        model_dir:
          parameterType: STRING
        model_version:
          parameterType: STRING
        n_episodes:
          parameterType: NUMBER_INTEGER
        project:
          parameterType: STRING
        region:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        summary:
          parameterType: STRING
  comp-heavy-eval-container:
    executorLabel: exec-heavy-eval-container
    inputDefinitions:
      parameters:
        accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        bucket:
          parameterType: STRING
        dataset:
          parameterType: STRING
        max_std_threshold:
          parameterType: NUMBER_DOUBLE
        model_dir:
          parameterType: STRING
        model_version:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        test_episodes:
          parameterType: NUMBER_INTEGER
        train_accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        train_accuracy_mean:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        accuracy_recomputed:
          parameterType: NUMBER_DOUBLE
        passed:
          parameterType: BOOLEAN
        reason:
          parameterType: STRING
  comp-log-experiment-component:
    executorLabel: exec-log-experiment-component
    inputDefinitions:
      parameters:
        accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        accuracy_mean:
          parameterType: NUMBER_DOUBLE
        accuracy_std:
          parameterType: NUMBER_DOUBLE
        data_sha:
          parameterType: STRING
        dataset:
          parameterType: STRING
        experiment_name:
          parameterType: STRING
        gate_passed:
          parameterType: BOOLEAN
        gate_reason:
          parameterType: STRING
        k_shot:
          parameterType: NUMBER_INTEGER
        n_way:
          parameterType: NUMBER_INTEGER
        project:
          parameterType: STRING
        query:
          parameterType: NUMBER_INTEGER
        region:
          parameterType: STRING
        run_type:
          parameterType: STRING
        seed:
          parameterType: NUMBER_INTEGER
        train_iters:
          parameterType: NUMBER_INTEGER
        train_time:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-promote-image-component:
    executorLabel: exec-promote-image-component
    inputDefinitions:
      parameters:
        image_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        repo:
          parameterType: STRING
        source_tag:
          parameterType: STRING
        target_tag:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-promote-model-component:
    executorLabel: exec-promote-model-component
    inputDefinitions:
      parameters:
        model_resource_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        version_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-register-model-component:
    executorLabel: exec-register-model-component
    inputDefinitions:
      parameters:
        accuracy_mean:
          parameterType: NUMBER_DOUBLE
        data_sha:
          parameterType: STRING
        model_dir:
          parameterType: STRING
        model_display_name:
          parameterType: STRING
        project:
          parameterType: STRING
        region:
          parameterType: STRING
        seed:
          parameterType: NUMBER_INTEGER
        serving_container_image_uri:
          parameterType: STRING
    outputDefinitions:
      parameters:
        resource_name:
          parameterType: STRING
        version_id:
          parameterType: STRING
  comp-rejection-report-component:
    executorLabel: exec-rejection-report-component
    inputDefinitions:
      parameters:
        accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        accuracy_mean:
          parameterType: NUMBER_DOUBLE
        accuracy_std:
          parameterType: NUMBER_DOUBLE
        accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        gate_reason:
          parameterType: STRING
        max_std_threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-train-container:
    executorLabel: exec-train-container
    inputDefinitions:
      parameters:
        base_output_directory:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        bucket:
          parameterType: STRING
        dataset:
          parameterType: STRING
        display_name:
          defaultValue: fsl-training-job
          isOptional: true
          parameterType: STRING
        embedding_hid:
          parameterType: NUMBER_INTEGER
        enable_web_access:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        encryption_spec_key_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        k_shot:
          parameterType: NUMBER_INTEGER
        labels:
          isOptional: true
          parameterType: STRUCT
        location:
          defaultValue: '{{$.pipeline_google_cloud_location}}'
          isOptional: true
          parameterType: STRING
        max_wait_duration:
          defaultValue: 86400s
          isOptional: true
          parameterType: STRING
        n_way:
          parameterType: NUMBER_INTEGER
        network:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        persistent_resource_id:
          defaultValue: '{{$.pipeline_persistent_resource_id}}'
          isOptional: true
          parameterType: STRING
        project:
          parameterType: STRING
        psc_interface_config:
          isOptional: true
          parameterType: STRUCT
        query:
          parameterType: NUMBER_INTEGER
        reserved_ip_ranges:
          isOptional: true
          parameterType: LIST
        restart_job_on_worker_restart:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        seed:
          parameterType: NUMBER_INTEGER
        service_account:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        strategy:
          defaultValue: STANDARD
          isOptional: true
          parameterType: STRING
        tensorboard:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        timeout:
          defaultValue: 604800s
          isOptional: true
          parameterType: STRING
        train_iters:
          parameterType: NUMBER_INTEGER
        worker_pool_specs:
          defaultValue:
          - container_spec:
              args:
              - --project
              - '{{$.inputs.parameters[''project'']}}'
              - --bucket
              - '{{$.inputs.parameters[''bucket'']}}'
              - --dataset
              - '{{$.inputs.parameters[''dataset'']}}'
              - --n-way
              - '{{$.inputs.parameters[''n_way'']}}'
              - --k-shot
              - '{{$.inputs.parameters[''k_shot'']}}'
              - --query
              - '{{$.inputs.parameters[''query'']}}'
              - --seed
              - '{{$.inputs.parameters[''seed'']}}'
              - --train-iters
              - '{{$.inputs.parameters[''train_iters'']}}'
              - --embedding-hid
              - '{{$.inputs.parameters[''embedding_hid'']}}'
              - --accuracy-mean-output-path
              - '{{$.outputs.parameters[''accuracy_mean''].output_file}}'
              - --accuracy-ci95-output-path
              - '{{$.outputs.parameters[''accuracy_ci95''].output_file}}'
              - --accuracy-std-output-path
              - '{{$.outputs.parameters[''accuracy_std''].output_file}}'
              - --train-time-output-path
              - '{{$.outputs.parameters[''train_time''].output_file}}'
              - --model-dir-output-path
              - '{{$.outputs.parameters[''model_dir''].output_file}}'
              - --data-sha-output-path
              - '{{$.outputs.parameters[''data_sha''].output_file}}'
              command:
              - python
              - scripts/train_pipeline_entry.py
              env: []
              image_uri: us-central1-docker.pkg.dev/dark-data-discovery/fsl-images/train:candidate
            disk_spec:
              boot_disk_size_gb: 100.0
              boot_disk_type: pd-ssd
            machine_spec:
              machine_type: n1-standard-4
            replica_count: 1.0
          isOptional: true
          parameterType: LIST
    outputDefinitions:
      parameters:
        accuracy_ci95:
          parameterType: NUMBER_DOUBLE
        accuracy_mean:
          parameterType: NUMBER_DOUBLE
        accuracy_std:
          parameterType: NUMBER_DOUBLE
        data_sha:
          parameterType: STRING
        gcp_resources:
          parameterType: STRING
        model_dir:
          parameterType: STRING
        train_time:
          parameterType: NUMBER_DOUBLE
  comp-verify-frozen-component:
    executorLabel: exec-verify-frozen-component
    inputDefinitions:
      parameters:
        bucket:
